<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Lykompanion Overlay</title>
  <!-- One instance of this page is loaded per overlay widget, each in its own small native
       window sized and positioned by run_app.py (?widget=toasts or ?widget=game-state picks
       which one to render) - NOT one shared full-screen window. There is NO pixel
       transparency and NO region clipping (both are dead ends for WebView2 - see CLAUDE.md's
       in-game overlay section): instead the native window is moved+RESIZED to exactly match
       its visible content (syncWindowFit in overlay.js -> fit_overlay bridge), so the card
       containers must fill the window edge-to-edge and be solid - any page background that
       peeks through (gaps, margins, translucency) renders as BLACK, not as the game behind.
       Normally nothing is interactive (clicks pass through to the game); the
       layout editor (Settings → "Edit layout", or Ctrl+Shift+O) temporarily lifts the
       click-through so the whole widget window can be dragged to reposition it - dragging
       moves the actual native window (via a Python-exposed move_overlay bridge) and saves on
       release, there is no separate Save/Cancel step. Deliberately NOT part of the
       web/js/app/*.js chain: it shares no state with the main window and talks to the server
       on its own (SSE + polling). -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100%;
      font-family: "Segoe UI", system-ui, sans-serif;
      user-select: none;
      cursor: default;
    }
    body.editing {
      outline: 2px dashed #7aa2f7;
      outline-offset: -2px;
      /* While editing, the native window region covers the whole window and WebView2
         renders the page's transparent background as BLACK (alpha-0 in a normal hwnd) -
         so paint a deliberate, clearly-visible panel instead of what reads as a broken
         black box. Normal (non-editing) mode never shows this area at all: the region is
         clipped to exactly the opaque cards. */
      background: #1c2233;
      cursor: move;
    }

    #edit-hint {
      position: absolute;
      top: 4px;
      left: 8px;
      right: 8px;
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #7aa2f7;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      display: none;
      pointer-events: none;
    }
    body.editing #edit-hint { display: block; }

    /* --- Toasts widget (companion replies + fired reminders) ---
       The native window is RESIZED to exactly this container (see syncWindowFit in
       overlay.js), so it must fill the window edge-to-edge (inset 0, no outer margins)
       and be ONE solid card: separate cards with transparent gaps between them would show
       the page's background - which WebView2 renders as black - as black strips. */
    #toast-stack {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      background: #10121a;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      overflow: hidden;
    }
    #toast-stack:not(:empty) { display: block; }
    .toast {
      border-left: 3px solid #7aa2f7;
      padding: 10px 14px;
      color: #e8eaf2;
      font-size: 15px;
      line-height: 1.45;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transition: opacity 0.35s ease;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .toast + .toast { border-top: 1px solid rgba(255, 255, 255, 0.10); }
    .toast.visible { opacity: 1; }
    .toast.leaving { opacity: 0; }
    .toast.reminder { border-left-color: #e0af68; }
    .toast .toast-tag {
      display: block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.65;
      margin-bottom: 4px;
    }

    /* --- Game-state widget --- (fills the fitted window edge-to-edge, like #toast-stack) */
    #gs-panel {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: #10121a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px 14px;
      color: #e8eaf2;
      font-size: 13px;
      display: none;
    }
    #gs-panel.visible { display: block; }
    #gs-title {
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .gs-row { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; }
    .gs-label { opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gs-value { font-weight: 600; text-align: right; }
  </style>
</head>
<body>
  <div id="edit-hint">Drag to move · Ctrl+Shift+O to finish</div>
  <div id="gs-panel">
    <div id="gs-title"></div>
    <div id="gs-rows"></div>
  </div>
  <div id="toast-stack"></div>
  <script src="js/overlay.js"></script>
</body>
</html>
