<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Lykompanion Overlay</title>
  <!-- One instance of this page is loaded per overlay widget, each in its own small native
       window sized and positioned by run_app.py (?widget=toasts or ?widget=game-state picks
       which one to render) - NOT one shared full-screen window. A full-screen transparent
       WebView2 window proved unreliable across several win32/DWM attempts (see CLAUDE.md's
       in-game overlay section); small per-widget windows are a far more common, better-tested
       case for real desktop transparency. Everything here must keep a fully transparent
       background. Normally nothing is interactive (clicks pass through to the game); the
       layout editor (Settings → "Edit layout", or Ctrl+Shift+O) temporarily lifts the
       click-through so the whole widget window can be dragged to reposition it - dragging
       moves the actual native window (via a Python-exposed move_overlay bridge) and saves on
       release, there is no separate Save/Cancel step. Deliberately NOT part of the
       web/js/app/*.js chain: it shares no state with the main window and talks to the server
       on its own (SSE + polling). -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100%;
      font-family: "Segoe UI", system-ui, sans-serif;
      user-select: none;
      cursor: default;
    }
    body.editing {
      outline: 2px dashed #7aa2f7;
      outline-offset: -2px;
      background: rgba(122, 162, 247, 0.10);
      cursor: move;
    }

    #edit-hint {
      position: absolute;
      top: 4px;
      left: 8px;
      right: 8px;
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #7aa2f7;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      display: none;
      pointer-events: none;
    }
    body.editing #edit-hint { display: block; }

    /* --- Toasts widget (companion replies + fired reminders) --- */
    #toast-stack {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast {
      background: rgba(16, 18, 26, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-left: 3px solid #7aa2f7;
      border-radius: 10px;
      padding: 10px 14px;
      color: #e8eaf2;
      font-size: 15px;
      line-height: 1.45;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .toast.visible { opacity: 1; transform: translateY(0); }
    .toast.leaving { opacity: 0; transform: translateY(-8px); }
    .toast.reminder { border-left-color: #e0af68; }
    .toast .toast-tag {
      display: block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.65;
      margin-bottom: 4px;
    }

    /* --- Game-state widget --- */
    #gs-panel {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      background: rgba(16, 18, 26, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px 14px;
      color: #e8eaf2;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      display: none;
    }
    #gs-panel.visible { display: block; }
    #gs-title {
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .gs-row { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; }
    .gs-label { opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gs-value { font-weight: 600; text-align: right; }
  </style>
</head>
<body>
  <div id="edit-hint">Drag to move · Ctrl+Shift+O to finish</div>
  <div id="gs-panel">
    <div id="gs-title"></div>
    <div id="gs-rows"></div>
  </div>
  <div id="toast-stack"></div>
  <script src="js/overlay.js"></script>
</body>
</html>
